name: localnet_algod
config:
    # Lead node URL (source of truth - producing blocks)
    lead-node-url: "http://localhost:8080"

    # Follower node URL (syncs from lead, serves Conduit - must be in follower mode)
    follower-node-url: "http://localhost:8081"

    # Default API token (optional, used for both nodes if specific tokens are not provided)
    # token: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

    # Follower node API token (optional, overrides 'token' for follower node)
    # follower-node-token: "your-follower-specific-token"

    # Lead node API token (optional, overrides 'token' for lead node)
    # lead-node-token: "your-lead-specific-token"
